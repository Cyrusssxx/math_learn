<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精选选填</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#4a90d9">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/exam.css">
    <link rel="stylesheet" href="vendor/katex/katex.min.css">
</head>
<body>
    <header class="exam-top">
        <div class="exam-brand">
            <span class="exam-logo">✨</span>
            <div>
                <div class="exam-title">精选选填</div>
                <div class="exam-sub" id="examSub">模拟卷选择题+填空题 · 收藏错题</div>
            </div>
        </div>
        <div class="exam-topbtns">
            <button class="exam-btn" id="favOnly" onclick="toggleFavOnly()" title="只看已收藏题目">⭐ 收藏夹</button>
            <button class="exam-btn" onclick="toggleDark()" title="切换夜间模式">🌙 <span id="darkState">关</span></button>
            <a class="exam-btn" href="index.html" target="_blank" title="返回笔记站">📚 笔记</a>
        </div>
    </header>

    <div class="exam-wrap">
        <!-- 左：套卷列表 -->
        <aside class="exam-side" id="examSide">
            <div class="exam-side-head">
                <div class="exam-side-title">套卷列表</div>
                <button class="side-toggle" id="sideToggle" onclick="toggleSide()" title="收起/展开套卷列表">◀</button>
            </div>
            <div id="paperList"></div>
        </aside>

        <!-- 中：题目列表 -->
        <main class="exam-main" id="examMain">
            <div class="loading">加载中…</div>
        </main>
    </div>

    <!-- 右：悬浮题号导航 -->
    <div class="float-q" id="floatQ">
        <div class="float-q-head" onclick="toggleFloatQ()">
            <span class="float-q-no" id="floatQNo">—</span>
            <span class="float-q-arrow" id="floatQArrow">▲</span>
        </div>
        <div class="float-q-list" id="floatQList"></div>
    </div>

    <script src="js/common.js"></script>
    <script defer src="vendor/katex/katex.min.js"></script>
    <script defer src="vendor/katex/auto-render.min.js"></script>
    <script defer src="js/selected.js"></script>
</body>
</html>
