<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考研数学笔记</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#4a90d9">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/notes.css">
    <link rel="stylesheet" href="vendor/katex/katex.min.css">
</head>
<body>
    <!-- 左栏：站点标题 + 搜索 + 文件目录树 -->
    <aside class="sidebar" id="sidebar">
        <div class="side-head">
            <div class="brand">考研数学笔记</div>
            <a class="exam-link selected-link" href="selected.html" target="_blank" title="打开精选选填（新标签页）">✨ 精选选填</a>
            <button class="dark-btn" id="darkSwitch" onclick="toggleDark()" title="切换夜间模式">
                🌙 <span id="darkState">关</span>
            </button>
        </div>
        <div class="side-links">
            <a class="exam-link" href="exam.html" target="_blank" title="打开数学二历年真题（新标签页）">
                📝 数学二真题
            </a>
            <a class="exam-link good-link" href="good.html" target="_blank" title="打开好题刷题模块（新标签页）">
                🎯 好题刷题
            </a>
        </div>
        <div class="search-box">
            <input type="search" id="searchInput" placeholder="搜索…"
                   autocomplete="off" oninput="onSearchDebounced(this.value)" onfocus="onSearchFocus(this.value)">
            <div class="search-chips" id="searchChips">
                <button class="on" data-subj="" onclick="setSearchSubject('', this)">全部</button>
                <button data-subj="zy" onclick="setSearchSubject('zy', this)">考前21记</button>
                <button data-subj="gs" onclick="setSearchSubject('gs', this)">高等数学</button>
                <button data-subj="xd" onclick="setSearchSubject('xd', this)">线性代数</button>
            </div>
            <div class="search-results" id="searchResults" hidden></div>
        </div>
        <nav class="nav-tree" id="navTree">
            <div class="loading">加载中…</div>
        </nav>
        <div class="side-foot">
            <span id="navTimer" title="今日阅读时长（切换到其他窗口时暂停）">⏱ 00:00:00</span>
            <span class="foot-btns">
                <button onclick="Annot.exportAnnot()" title="备份全部荧光/批注到 JSON 文件">导出标注</button>
                <button onclick="Annot.openRecover()" title="找回因笔记内容变动而丢失位置的标注">恢复</button>
                <button onclick="document.getElementById('annImport').click()" title="从备份恢复标注（合并）">导入</button>
                <input type="file" id="annImport" accept="application/json" style="display:none" onchange="Annot.importAnnot(this)">
            </span>
        </div>
    </aside>

    <!-- 移动端：左上角展开目录按钮 -->
    <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('show')">☰</button>

    <!-- 中栏：笔记正文（随页面滚动） -->
    <main class="doc" id="docPane">
        <div class="loading">加载中…</div>
    </main>

    <!-- 右栏：本页目录 -->
    <aside class="toc" id="tocPane"></aside>

    <script src="js/common.js"></script>
    <script defer src="vendor/katex/katex.min.js"></script>
    <script defer src="vendor/katex/auto-render.min.js"></script>
    <script defer src="js/annotate.js"></script>
    <script defer src="js/reader.js"></script>

    <!-- 背景自定义面板 -->
    <button class="bg-fab" id="bgFab" onclick="toggleBgPanel()" title="背景设置" aria-label="背景设置">🎨</button>
    <div class="bg-panel" id="bgPanel" hidden>
        <div class="bg-panel-head">
            <span>背景设置</span>
            <button class="bg-panel-close" onclick="toggleBgPanel()" aria-label="关闭">✕</button>
        </div>
        <div class="bg-section">
            <label>预设背景</label>
            <div class="bg-swatches" id="bgSwatches"></div>
        </div>
        <div class="bg-section">
            <label>自定义图片</label>
            <input type="file" id="bgUpload" accept="image/jpeg,image/png,image/webp" hidden onchange="handleBgUpload(this.files[0])">
            <button class="bg-btn" onclick="document.getElementById('bgUpload').click()">上传图片</button>
            <span class="bg-hint">支持 jpg/png/webp，自动压缩至 1920px</span>
        </div>
        <div class="bg-section">
            <label>遮罩强度 <span id="bgOverlayVal">35%</span></label>
            <input type="range" id="bgOverlay" min="0" max="90" value="35" oninput="setBgOverlay(this.value)">
        </div>
        <div class="bg-section">
            <label>UI 透明度 <span id="bgUiAlphaVal">30%</span></label>
            <input type="range" id="bgUiAlpha" min="0" max="100" value="30" oninput="setBgUiAlpha(this.value)">
        </div>
        <div class="bg-section">
            <label>应用范围</label>
            <div class="bg-scope-btns">
                <button class="bg-btn" id="bgScopeAll" onclick="setBgScopeAll()">全站</button>
                <button class="bg-btn" id="bgScopePage" onclick="setBgScopePage()">仅本页</button>
            </div>
            <div class="bg-scope-list" id="bgScopeList"></div>
            <span class="bg-hint">仅应用到勾选的页面。</span>
        </div>
        <div class="bg-section">
            <button class="bg-btn bg-btn-danger" onclick="resetBg()">重置为默认</button>
        </div>
    </div>

    <!-- 背景自定义逻辑 -->
    <script>
(function() {
    const K = { type: 'mathnote_bg_type', value: 'mathnote_bg_value', overlay: 'mathnote_bg_overlay', uiAlpha: 'mathnote_ui_opacity', scope: 'mathnote_bg_scope' };
    const PRESETS = {
        light: 'linear-gradient(135deg, #fdfbf7, #ebf5fb)',
        dark: '#1f242c',
        blue: '#e8f0fe',
        green: '#e6f4ea',
        orange: '#fef3c7',
        purple: '#f3e8ff',
        grad1: 'linear-gradient(135deg, #84fab0, #8fd3f4)',
        grad2: 'linear-gradient(135deg, #fa709a, #fee140)',
        grad3: 'linear-gradient(135deg, #a1c4fd, #c2e9fb)',
        grad4: 'linear-gradient(135deg, #ff9a9e, #fad0c4)',
        grad5: 'linear-gradient(135deg, #d299c2, #fef9d7)',
        grad6: 'linear-gradient(135deg, #89f7fe, #66a6ff)'
    };

    function $(sel) { return document.querySelector(sel); }
    function $id(id) { return document.getElementById(id); }

    function applyBg() {
        const type = localStorage.getItem(K.type);
        const value = localStorage.getItem(K.value);
        const overlay = +localStorage.getItem(K.overlay) || 0;
        const inScope = getBgScope().includes(PAGE_ID);
        const uiAlpha = inScope ? (+localStorage.getItem(K.uiAlpha) || 30) / 100 : 1;

        document.documentElement.style.setProperty('--ui-alpha', uiAlpha);

        const body = document.body;
        const overlayEl = $id('bgOverlayEl');

        // 清除之前的背景
        body.style.backgroundImage = '';
        body.style.background = '';
        removeOverlay();

        // 本页不在应用范围内：不铺背景图、不叠遮罩，UI 透明度回默认
        if (!inScope) return;
        if (type === 'custom' && value) {
            body.style.backgroundImage = `url("${value}")`;
            body.style.backgroundSize = 'cover';
            body.style.backgroundAttachment = 'fixed';
            body.style.backgroundPosition = 'center';
            setOverlay(overlay);
        } else if (type === 'preset' && value && PRESETS[value]) {
            body.style.background = PRESETS[value];
            setOverlay(overlay);
        } else {
            // 默认：无背景图，仅遮罩
            setOverlay(overlay);
        }

        // 更新 UI 控件
        $id('bgOverlay').value = overlay;
        $id('bgOverlayVal').textContent = overlay + '%';
        $id('bgUiAlpha').value = Math.round(uiAlpha * 100);
        $id('bgUiAlphaVal').textContent = Math.round(uiAlpha * 100) + '%';

        // 高亮当前选中的预设
        document.querySelectorAll('.bg-swatch').forEach(el => {
            el.classList.toggle('active', el.dataset.preset === value);
        });
    }

    function removeOverlay() {
        const el = $id('bgOverlayEl');
        if (el) el.remove();
    }

    function setOverlay(pct) {
        const isDark = document.documentElement.classList.contains('dark');
        let el = $id('bgOverlayEl');
        if (!el) {
            el = document.createElement('div');
            el.id = 'bgOverlayEl';
            Object.assign(el.style, {
                position: 'fixed', inset: 0, zIndex: -1, pointerEvents: 'none'
            });
            document.body.prepend(el);
        }
        el.style.background = isDark
            ? `rgba(0, 0, 0, ${pct / 100 * 0.6})`
            : `rgba(255, 255, 255, ${pct / 100 * 0.85})`;
    }

    function compressAndStore(file, callback) {
        if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
            alert('仅支持 jpg / png / webp 格式');
            return;
        }
        const img = new Image();
        img.onload = () => {
            const max = 1920;
            let w = img.width, h = img.height;
            if (w > max || h > max) {
                if (w > h) { h = Math.round(h * max / w); w = max; }
                else { w = Math.round(w * max / h); h = max; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            callback(canvas.toDataURL('image/jpeg', 0.8));
            URL.revokeObjectURL(img.src);
        };
        img.src = URL.createObjectURL(file);
    }

    function handleBgUpload(file) {
        if (!file) return;
        compressAndStore(file, dataUrl => {
            localStorage.setItem(K.type, 'custom');
            localStorage.setItem(K.value, dataUrl);
            applyBg();
        });
    }

    function setBgOverlay(val) {
        localStorage.setItem(K.overlay, val);
        const type = localStorage.getItem(K.type);
        if (type === 'custom' || (type === 'preset' && localStorage.getItem(K.value))) {
            setOverlay(+val);
        }
        $id('bgOverlayVal').textContent = val + '%';
    }

    function setBgUiAlpha(val) {
        const alpha = +val / 100;
        localStorage.setItem(K.uiAlpha, val);
        document.documentElement.style.setProperty('--ui-alpha', alpha);
        $id('bgUiAlphaVal').textContent = val + '%';
    }

    function resetBg() {
        Object.values(K).forEach(k => localStorage.removeItem(k));
        applyBg();
    }

    function toggleBgPanel() {
        const panel = $id('bgPanel');
        panel.hidden = !panel.hidden;
        if (!panel.hidden) renderBgScope();
    }

    // 点击面板或 🎨 按钮以外的区域：关闭面板
    document.addEventListener('click', function (e) {
        const panel = $id('bgPanel');
        const fab = $id('bgFab');
        if (!panel || panel.hidden) return;
        if (panel.contains(e.target) || (fab && fab.contains(e.target))) return;
        panel.hidden = true;
    });

    // ============ 应用范围：背景/遮罩/UI 透明度作用于哪些页面 ============
    const PAGE_ID = 'index';   // 本页标识（index / exam / category 三页各不相同）
    const BG_PAGES = [
        { id: 'index', label: '笔记站首页' },
        { id: 'exam', label: '真题刷题' },
        { id: 'category', label: '分类页' },
    ];
    function getBgScope() {
        try {
            const arr = JSON.parse(localStorage.getItem(K.scope) || 'null');
            if (Array.isArray(arr) && arr.length) return arr;
        } catch (e) { }
        return BG_PAGES.map(p => p.id);   // 默认全站勾选
    }
    function renderBgScope() {
        const list = $id('bgScopeList');
        if (!list) return;
        const cur = getBgScope();
        list.innerHTML = BG_PAGES.map(p =>
            `<label><input type="checkbox" ${cur.includes(p.id) ? 'checked' : ''} onchange="toggleBgPage('${p.id}', this.checked)">${p.label}</label>`).join('');
        $id('bgScopeAll').classList.toggle('on', cur.length === BG_PAGES.length);
        $id('bgScopePage').classList.toggle('on', cur.length === 1 && cur[0] === PAGE_ID);
    }
    function saveBgScope(arr) { localStorage.setItem(K.scope, JSON.stringify(arr)); renderBgScope(); applyBg(); }
    function toggleBgPage(id, on) {
        let s = getBgScope();
        if (on && !s.includes(id)) s.push(id);
        if (!on) s = s.filter(x => x !== id);
        if (!s.length) s = [PAGE_ID];   // 至少保留本页，避免所有页面都没背景
        saveBgScope(s);
    }
    function setBgScopeAll() { saveBgScope(BG_PAGES.map(p => p.id)); }
    function setBgScopePage() { saveBgScope([PAGE_ID]); }

    // 初始化预设色块
    function initPresets() {
        const container = $id('bgSwatches');
        Object.entries(PRESETS).forEach(([key, val]) => {
            const btn = document.createElement('button');
            btn.className = 'bg-swatch';
            btn.dataset.preset = key;
            btn.style.background = val;
            btn.title = key;
            btn.onclick = () => {
                localStorage.setItem(K.type, 'preset');
                localStorage.setItem(K.value, key);
                applyBg();
            };
            container.appendChild(btn);
        });
    }

    // 监听暗色模式切换，自动更新遮罩颜色
    new MutationObserver(() => {
        const overlay = localStorage.getItem(K.overlay);
        if (overlay) setOverlay(+overlay);
    }).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
        initPresets();
        applyBg();
    });

    // 关键：面板 HTML 用内联 onclick/oninput，IIFE 内函数必须显式挂到 window 才能被调到
    Object.assign(window, {
        toggleBgPanel, handleBgUpload, setBgOverlay, setBgUiAlpha, resetBg,
        toggleBgPage, setBgScopeAll, setBgScopePage,
    });
})();
</script>
</body>
</html>
