<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真题分类</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#4a90d9">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/notes.css">
    <link rel="stylesheet" href="css/exam.css">
    <link rel="stylesheet" href="css/category.css">
    <link rel="stylesheet" href="vendor/katex/katex.min.css">
</head>
<body>
    <header class="exam-top">
        <div class="exam-brand">
            <span class="exam-logo">🗂</span>
            <div>
                <div class="exam-title">真题分类</div>
                <div class="exam-sub" id="examSub">按大观园多级分类（学科 / 章节 / 考点…）· 点击任意节点查看该分类下所有真题</div>
            </div>
        </div>
        <div class="exam-topbtns">
            <button class="exam-btn" id="favOnly" onclick="toggleFavView()" title="打开收藏夹（不分类，列出所有已收藏题目）">⭐ 收藏夹</button>
            <button class="exam-btn" onclick="toggleDark()" title="切换夜间模式">🌙 <span id="darkState">关</span></button>
            <a class="exam-btn" href="exam.html" title="返回真题页">📝 真题</a>
            <a class="exam-btn" href="index.html" title="打开笔记站">📚 笔记</a>
        </div>
    </header>

    <!-- 悬浮分类抽屉触发按钮 -->
    <button class="cat-drawer-trigger" id="catDrawerTrigger" onclick="toggleCatDrawer()" title="展开分类树">📂</button>

    <!-- 悬浮分类抽屉 -->
    <div class="cat-drawer-overlay" id="catDrawerOverlay" onclick="closeCatDrawer()"></div>
    <aside class="cat-drawer" id="catDrawer">
        <div class="cat-drawer-head">
            <div class="exam-side-title">知识点分类</div>
            <button class="cat-drawer-close" onclick="closeCatDrawer()" title="关闭">✕</button>
        </div>
        <div id="catTree"></div>
    </aside>

    <!-- 主内容区 -->
    <main class="exam-main cat-main-full" id="catMain">
        <div class="loading">加载中…</div>
    </main>

    <script src="js/common.js"></script>
    <script defer src="vendor/katex/katex.min.js"></script>
    <script defer src="vendor/katex/auto-render.min.js"></script>
    <script defer src="js/category.js"></script>
</body>
</html>
