<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真题分类</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#4a90d9">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/notes.css">
    <link rel="stylesheet" href="css/exam.css">
    <link rel="stylesheet" href="css/category.css">
    <link rel="stylesheet" href="vendor/katex/katex.min.css">
</head>
<body>
    <header class="exam-top">
        <div class="exam-brand">
            <span class="exam-logo">🗂</span>
            <div>
                <div class="exam-title">真题分类</div>
                <div class="exam-sub" id="examSub">按大观园三级分类（学科 / 章节 / 知识点）· 点击知识点查看跨年真题</div>
            </div>
        </div>
        <div class="exam-topbtns">
            <button class="exam-btn" id="favOnly" onclick="toggleFavOnly()" title="只看已收藏题目">⭐ 收藏夹</button>
            <button class="exam-btn" onclick="toggleDark()" title="切换夜间模式">🌙 <span id="darkState">关</span></button>
            <a class="exam-btn" href="exam.html" title="返回真题页">📝 真题</a>
            <a class="exam-btn" href="index.html" title="打开笔记站">📚 笔记</a>
        </div>
    </header>

    <div class="exam-wrap">
        <!-- 左：分类树（学科 / 章节，可折叠） -->
        <aside class="exam-side" id="catSide">
            <div class="exam-side-head">
                <div class="exam-side-title">知识点分类</div>
            </div>
            <div id="catTree"></div>
        </aside>

        <!-- 中：选中章节的跨年真题 -->
        <main class="exam-main" id="catMain">
            <div class="loading">加载中…</div>
        </main>
    </div>

    <script src="js/common.js"></script>
    <script defer src="vendor/katex/katex.min.js"></script>
    <script defer src="vendor/katex/auto-render.min.js"></script>
    <script defer src="js/category.js"></script>
</body>
</html>
